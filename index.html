<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>HASH SMOKE CLUB | Counter-Strike 2 Club</title>

  <meta name="description"
    content="HASH SMOKE CLUB — comunidade e competição de Counter-Strike 2. Entre no Portal HSC." />

  <meta name="robots" content="index,follow" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/svg+xml" href="img/logo/svg/HSC-shield-primary-gold.svg" />
  <link rel="shortcut icon" href="img/logo/svg/HSC-shield-primary-gold.svg" />
  <link rel="canonical" href="https://haxixesmokeclub.com/" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="HASH SMOKE CLUB" />
  <meta property="og:title" content="HASH SMOKE CLUB | Counter-Strike 2 Club" />
  <meta property="og:description" content="HASH SMOKE CLUB — comunidade e competição de Counter-Strike 2." />
  <meta property="og:url" content="https://haxixesmokeclub.com/" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&display=swap"
    rel="stylesheet" />

  <style>
    :root {
      --color-bg: #000000;

      --color-text-main: #f2eee7;
      --color-text-muted: #b2ada5;

      --color-primary: #c69749;
      --color-primary-strong: #d8ad68;
      --color-on-accent: #0b0905;

      --color-border: rgba(242, 238, 231, 0.16);

      --font-display: "Chakra Petch", ui-sans-serif, system-ui, sans-serif;
      --font-sans:
        "Barlow",
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--color-bg);
    }

    body {
      font-family: var(--font-sans);
      color: var(--color-text-main);
    }

    .hero {
      position: relative;
      isolation: isolate;

      width: 100vw;
      height: 100vh;
      height: 100svh;
      height: 100dvh;

      display: grid;
      place-items: center;

      overflow: hidden;
      background: var(--color-bg);
    }

    .hero__video {
      position: absolute;
      inset: 0;
      z-index: -3;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center;

      pointer-events: none;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;

      background:
        radial-gradient(circle at 50% 40%,
          rgba(198, 151, 73, 0.05) 0%,
          rgba(0, 0, 0, 0) 36%),
        rgba(0, 0, 0, 0.52);
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;

      background: linear-gradient(180deg,
          rgba(0, 0, 0, 0.2) 0%,
          rgba(0, 0, 0, 0) 38%,
          rgba(0, 0, 0, 0.22) 100%);

      pointer-events: none;
    }

    .hero__content {
      position: absolute;
      top: 24%;
      left: 50%;
      transform: translateX(-50%);

      width: min(90vw, 920px);
      padding: 24px 20px;

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;
    }

    .hero__logo {
      width: clamp(60px, 5vw, 82px);
      height: auto;
      margin-bottom: 20px;

      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.45));
    }

    .hero__title {
      margin: 0;

      font-family: var(--font-display);
      font-size: clamp(2.25rem, 4.8vw, 4.6rem);
      font-weight: 700;
      line-height: 0.96;
      letter-spacing: 0.05em;

      color: var(--color-text-main);
      text-transform: uppercase;

      text-wrap: balance;

      text-shadow: 0 8px 32px rgba(0, 0, 0, 0.52);
    }

    .hero__subtitle {
      margin: 14px 0 0;

      font-family: var(--font-display);
      font-size: clamp(0.78rem, 1.1vw, 0.96rem);
      font-weight: 500;
      line-height: 1.35;
      letter-spacing: 0.22em;

      color: var(--color-text-muted);
      text-transform: uppercase;
    }

    .hero__cta {
      min-height: 48px;
      margin-top: 22px;
      padding: 0 22px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border: 1px solid var(--color-primary);
      border-radius: 6px;

      background: var(--color-primary);
      color: var(--color-on-accent);

      font-family: var(--font-display);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.12em;

      text-decoration: none;
      text-transform: uppercase;

      box-shadow:
        0 12px 28px rgba(0, 0, 0, 0.28),
        0 0 20px rgba(198, 151, 73, 0.08);

      transition:
        background-color 180ms ease,
        border-color 180ms ease,
        transform 180ms ease,
        box-shadow 180ms ease;
    }

    .hero__cta:hover {
      background: var(--color-primary-strong);
      border-color: var(--color-primary-strong);

      transform: translateY(-2px);

      box-shadow:
        0 16px 38px rgba(0, 0, 0, 0.38),
        0 0 30px rgba(198, 151, 73, 0.16);
    }

    .hero__cta:focus-visible {
      outline: 3px solid var(--color-text-main);
      outline-offset: 4px;
    }

    @media (max-width: 640px) {
      @media (max-width: 640px) {
        .hero__content {
          top: 22%;
          width: min(92vw, 520px);
          padding-inline: 18px;
        }

        .hero__logo {
          margin-bottom: 16px;
        }

        .hero__subtitle {
          margin-top: 12px;
        }

        .hero__cta {
          margin-top: 20px;
        }
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero__cta {
        transition: none;
      }

      .hero__cta:hover {
        transform: none;
      }
    }
  </style>
</head>

<body>
  <main class="hero">
    <video class="hero__video" autoplay muted loop playsinline preload="auto" poster="img/hero/hsc-hero-poster.webp"
      aria-hidden="true">
      <source src="video/hsc-hero-60.mp4" type="video/mp4" />
    </video>

    <section class="hero__content" aria-labelledby="hero-title">
      <img class="hero__logo" src="img/logo/svg/HSC-shield-primary-gold.svg" alt="" width="508" height="512" />

      <h1 id="hero-title" class="hero__title">
        HASH SMOKE CLUB
      </h1>

      <p class="hero__subtitle">
        Counter-Strike 2 Club
      </p>

      <a class="hero__cta" href="https://haxixesmokeclub.com/portal/cs2">
        Entrar no Portal
      </a>
    </section>
  </main>
</body>

</html>
